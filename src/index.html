<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate QR codes for SEPA payments (EPC-QR/GiroCode)">
    <meta name="theme-color" content="#667eea">
    <title>EPC-QR Generator</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <h1>EPC-QR (GiroCode) Generator</h1>
        <p class="subtitle">Generate QR codes for SEPA payments</p>
        <form id="epcForm">
            <div class="remember-section">
                <label class="checkbox-label">
                    <input type="checkbox" id="remember-credentials">
                    <span>Remember Name and IBAN (LocalStorage)</span>
                </label>
            </div>

            <div class="form-group">
                <label for="name">Beneficiary Name *</label>
                <input type="text" id="name" required maxlength="70" placeholder="e.g. Frank Nord">
            </div>

            <div class="form-group">
                <label for="iban">IBAN *</label>
                <input type="text" id="iban" required maxlength="34" pattern="[A-Z]{2}[0-9]{2}[A-Z0-9]{1,30}" placeholder="e.g. DE1234567890123">
            </div>

            <div class="form-group">
                <label for="amount">Amount (EUR) *</label>
                <input type="number" id="amount" required step="0.01" min="0.01" placeholder="e.g. 8,50">
                <small>Amount in EUR</small>
            </div>

            <div class="form-group">
                <label for="text">Payment Reference</label>
                <input type="text" id="text" maxlength="140" placeholder="e.g. Pizza :D">
            </div>
        </form>

        <div id="qr-container">
            <canvas id="qrcode"></canvas>
            <button id="shareBtn" class="share-btn" disabled>Share QR Code</button>
        </div>

        <div id="error-message" class="error-message"></div>
    </div>

    <script src="lib/qrcodegen.js"></script>
    <script src="app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>

    <footer>
        <p><a href="https://github.com/whosmatt/girocode-ts" target="_blank">Visit me on GitHub!</a></p>
    </footer>
</body>
</html>
