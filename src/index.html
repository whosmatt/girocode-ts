<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate QR codes for SEPA payments (EPC-QR/GiroCode)">
    <meta name="theme-color" content="#667eea">
    <title>GiroCode Generator</title>
    <link rel="icon" type="image/png" href="icons/32.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/180.png">
</head>
<body>
    <div class="container">
        <div class="form-wrapper">
            <h1>GiroCode (EPC-QR) Generator</h1>
            <p class="subtitle">Locally generate QR codes for SEPA payments<br>EU banks only, EUR only, no BIC required</p>
            <form id="epcForm">
                <div class="remember-section">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember-credentials">
                        <span>Remember name and IBAN</span>
                    </label>
                </div>

                <div class="form-group">
                    <label for="name">Beneficiary Name *</label>
                    <input type="text" id="name" required maxlength="70" placeholder="e.g. Frank Nord">
                </div>

                <div class="form-group">
                    <label for="iban">IBAN *</label>
                    <input type="text" id="iban" required maxlength="34" pattern="[A-Z]{2}[0-9]{2}[A-Z0-9]{1,30}" placeholder="e.g. DE1234567890123">
                </div>

                <div class="form-group">
                    <label for="amount">Amount (EUR) *</label>
                    <input type="number" id="amount" required step="0.01" min="0.01" placeholder="e.g. 8,50">
                </div>

                <div class="form-group">
                    <label for="text">Payment Reference</label>
                    <input type="text" id="text" maxlength="140" placeholder="e.g. Pizza :D">
                </div>

                <div id="error-message" class="error-message"></div>
            </form>
        </div>

        <div class="qr-wrapper">
            <div id="qr-container">
                <div id="qr-canvas-wrapper">
                    <canvas id="qrcode"></canvas>
                </div>
                <button id="shareBtn" class="share-btn" disabled>Share QR Code</button>
            </div>
        </div>
    </div>

    <script src="lib/qrcodegen.js"></script>
    <script src="app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>

    <footer>
        <p><a href="https://github.com/whosmatt/girocode-ts" target="_blank">Visit me on GitHub!</a></p>
    </footer>
</body>
</html>
